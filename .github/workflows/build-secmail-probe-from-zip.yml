name: Build Secmail Reader Probe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Secmail_Reader_Probe_v*_source.zip'
      - '.github/workflows/build-secmail-probe-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest source version
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(python3 - <<'PYSEL'
import glob, re

files = glob.glob('Secmail_Reader_Probe_v*_source.zip')

def ver_key(path):
    m = re.fullmatch(r'Secmail_Reader_Probe_v(\d+(?:\.\d+)*)_source\.zip', path)
    if not m:
        return None
    return tuple(int(x) for x in m.group(1).split('.'))

valid = [(ver_key(f), f) for f in files]
valid = [(v, f) for v, f in valid if v is not None]
if not valid:
    raise SystemExit('No valid Secmail source ZIP found')

valid.sort(key=lambda x: x[0])
print(valid[-1][1])
PYSEL
          )"

          test -f "$ZIP"
          VERSION="${ZIP#Secmail_Reader_Probe_}"
          VERSION="${VERSION%_source.zip}"
          PROJECT="Secmail_Reader_Probe_${VERSION}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Selected source: $ZIP"
          echo "Selected version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT"
          unzip -q "$ZIP"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          SRC="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"

          OUT="Secmail_Reader_Probe_${VERSION}.apk"
          cp "$SRC" "$OUT"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$OUT" | tee APK_BADGING.txt

          grep -q "package: name='com.mintomax.secmailprobe'" APK_BADGING.txt
          grep -q "application-label:'Secmail Assistant'" APK_BADGING.txt

          sha256sum "$OUT" | tee SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Secmail_Reader_Probe_${{ env.VERSION }}_APK
          path: |
            Secmail_Reader_Probe_${{ env.VERSION }}.apk
            APK_BADGING.txt
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
