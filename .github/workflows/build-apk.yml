      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AI_CrossCheck_v1.apk
          sha256sum out/AI_CrossCheck_v1.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_CrossCheck_v1_APK
          path: |
            out/AI_CrossCheck_v1.apk
            out/SHA256.txt
          if-no-files-found: error